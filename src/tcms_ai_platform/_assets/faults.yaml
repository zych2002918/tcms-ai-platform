schema_version: 1
faults:
- fid: F-TCMS-001
  key: soc_low
  name: SOC 偏低
  subsystem: 能源
  layer: application
  level: info
  action: none
  sil: '0'
  desc: SOC 低于阈值，建议充电
  detect: EnergyStatus.SocPercent 阈值监测（interlocks.soc_low_charge_guard）
  inject: 仿真器注入 EnergyStatus 帧 SocPercent 低值
  recovery: 充电至阈值以上自动恢复
- fid: F-TCMS-002
  key: temp_high
  name: 电池温度偏高
  subsystem: 能源
  layer: application
  level: info
  action: none
  sil: '0'
  desc: 电池温度接近上限，监控中
  detect: EnergyStatus.BatteryTemp 阈值监测
  inject: 注入 EnergyStatus 帧 BatteryTemp 高值
  recovery: 温度回落后自动恢复
- fid: F-TCMS-003
  key: door_sensor_noise
  name: 车门传感器偶发噪声
  subsystem: 车门
  layer: signal
  level: minor
  action: warning
  sil: '1'
  desc: 车门状态信号瞬时跳变（噪声）
  detect: 状态稳定性/时序检查（seqcheck 乱序/跳变检测）
  inject: 注入单帧异常 DoorControl 状态
  recovery: 连续有效帧确认后恢复
- fid: F-TCMS-004
  key: speed_sensor_drift
  name: 速度传感器轻微漂移
  subsystem: 牵引
  layer: signal
  level: minor
  action: warning
  sil: '1'
  desc: 速度信号缓慢漂移偏离真实值
  detect: 2oo3 表决不一致（voting.SpeedVoter2oo3）/ 变化率监测
  inject: 仿真器 set_speed 注入慢变偏移
  recovery: 漂移消失且多通道一致后恢复
- fid: F-TCMS-005
  key: door_fault
  name: 车门故障（按未关处理）
  subsystem: 车门
  layer: signal
  level: major
  action: derate
  sil: '2'
  desc: 车门状态不可信（Fault/Unknown），禁止发车
  detect: DoorControl 状态枚举检查（DOOR_STATE=2/3）
  inject: 注入 DoorControl 帧门状态为 Fault/Unknown
  recovery: 车门状态恢复正常且联锁通过
- fid: F-TCMS-006
  key: traction_loss
  name: 牵引丢失
  subsystem: 牵引
  layer: application
  level: major
  action: derate
  sil: '2'
  desc: 牵引系统失效，降级运行
  detect: TractionBrakeHandle.TractionActive 与速度矛盾检查
  inject: 注入牵引不可用状态
  recovery: 牵引恢复请求后重建
- fid: F-TCMS-007
  key: overspeed
  name: 超速
  subsystem: 牵引
  layer: application
  level: major
  action: derate
  sil: '2'
  desc: 速度超过限速（默认 160 km/h），需限速处置
  detect: ATP 速度监督（atp.SpeedSupervisor：Warning/SBI/EBI）
  inject: 仿真器 set_speed 越过限速
  recovery: 速度回落后按 ATP 曲线缓解
- fid: F-TCMS-008
  key: heartbeat_loss_vcu
  name: VCU 心跳丢失
  subsystem: VCU
  layer: node
  level: major
  action: derate
  sil: '2'
  desc: 主控节点心跳超时（周期 100ms × 丢失阈值），判定节点离线
  detect: 看门狗健康表（watchdogs.NodeHealthTable 超时/丢帧判定）
  inject: 节点停止发送心跳（simulator 停发 / multinode disable_node）
  recovery: 心跳恢复且连续有效后重新激活（迟滞恢复）
- fid: F-TCMS-009
  key: crc_error_frame
  name: 报文 CRC 校验错误
  subsystem: 网络
  layer: frame
  level: major
  action: warning
  sil: '3'
  desc: 帧数据被破坏导致 CRC-8 校验失败（完整性机制检出）
  detect: 应用层 CRC-8（faults.compute_crc8/verify_crc8），错误帧丢弃并计数
  inject: 位翻转/字节损坏注入（faults.flip_bit/corrupt_byte）
  recovery: 连续校验通过帧后恢复
- fid: F-TCMS-010
  key: node_restart_storm
  name: 节点重启风暴
  subsystem: 网络
  layer: node
  level: major
  action: derate
  sil: '2'
  desc: 节点反复复位（上下电振荡），周期性失活
  detect: 健康表反复 fault/active 翻转计数
  inject: 周期 disable/enable 节点（multinode）
  recovery: 重启平息且稳定运行 N 周期后重新投入
- fid: F-TCMS-011
  key: eb_failure
  name: 紧急制动执行失败
  subsystem: 制动
  layer: application
  level: critical
  action: emergency_brake
  sil: '4'
  desc: EB 命令发出但执行回路无响应
  detect: 执行反馈闭环（exec_feedback：压力+回执+牵引切除三重证据）
  inject: 注入 EB 执行回路故障（ebr 断点/回执缺失）
  recovery: 冗余回路缓解 + 人工复位
- fid: F-TCMS-012
  key: traction_brake_conflict
  name: 牵引制动冲突
  subsystem: 制动
  layer: application
  level: critical
  action: emergency_brake
  sil: '4'
  desc: 牵引与制动同时施加（方向/手柄矛盾）
  detect: 联锁（interlocks.traction_brake_conflict）
  inject: 注入手柄牵引+制动同时激活
  recovery: 冲突消失（手柄回零）后缓解
- fid: F-TCMS-013
  key: pantograph_arc
  name: 受电弓拉弧风险
  subsystem: 受电弓
  layer: signal
  level: critical
  action: emergency_brake
  sil: '4'
  desc: 受电弓升起但网压异常（拉弧风险），需降弓停车
  detect: 联锁（interlocks.pantograph_arc_risk：弓状态×网压）
  inject: 注入 PantographStatus 弓升起 + 网压低值
  recovery: 降弓或网压恢复后复位
- fid: F-TCMS-014
  key: bus_short
  name: 总线短路
  subsystem: 网络
  layer: bus
  level: critical
  action: shutdown
  sil: '3'
  desc: CAN 总线物理短路（持续显性），全节点错误帧
  detect: 错误状态机 Bus-Off（errstate）+ 总线故障注入观察
  inject: busfault 短路注入（全体发送失败）
  recovery: 短路移除 + 节点自动恢复（Bus-Off 恢复序列）
- fid: F-TCMS-015
  key: rolling_counter_gap
  name: 滚动计数器跳变
  subsystem: 网络
  layer: frame
  level: minor
  action: warning
  sil: '2'
  desc: 报文 alive/rolling counter 跳变（丢帧或注入），接收端检测
  detect: 计数器连续性检查（seqcheck 序列/丢帧检测）
  inject: 修改帧 counter 字节（corrupt_byte）
  recovery: counter 恢复连续后解除
- fid: F-TCMS-016
  key: bit_flip_frame
  name: 单比特翻转
  subsystem: 网络
  layer: frame
  level: major
  action: warning
  sil: '3'
  desc: 随机单比特翻转（EMI/硬件），由完整性机制兜底
  detect: CRC-8 校验失败（faults.compute_crc8）或值域检查
  inject: 位翻转注入（faults.flip_bit）
  recovery: 错误帧丢弃，后续正确帧恢复
- fid: F-TCMS-017
  key: sensor_stuck
  name: 传感器卡死
  subsystem: 信号
  layer: signal
  level: minor
  action: warning
  sil: '1'
  desc: 传感器输出恒值不随工况变化（卡死），变化率检测
  detect: 信号变化率/新鲜度检查（jitter/seqcheck 定时分析）
  inject: 仿真器信号冻结为恒值
  recovery: 信号恢复变化且有效后解除
- fid: F-TCMS-018
  key: bus_open_circuit
  name: 总线断路
  subsystem: 网络
  layer: bus
  level: major
  action: derate
  sil: '3'
  desc: 总线断路（无 ACK），发送节点 TEC 上升至 passive
  detect: 错误状态机（errstate Error-Passive）+ ACK 失败计数
  inject: busfault 断路注入（发送侧错误累加）
  recovery: 断路恢复后自动恢复
- fid: F-TCMS-019
  key: bus_noise_burst
  name: 总线噪声突发
  subsystem: 网络
  layer: bus
  level: minor
  action: warning
  sil: '1'
  desc: 随机位错误突发（电磁干扰），接收错误计数上升
  detect: REC/TEC 统计（errstate）+ CRC 失败计数
  inject: busfault 噪声注入（随机位错误）
  recovery: 噪声停止后按 ISO 11898-1 错误计数器衰减恢复
- fid: F-TCMS-020
  key: brake_actuator_stuck
  name: 制动执行器卡滞
  subsystem: 制动
  layer: application
  level: major
  action: derate
  sil: '2'
  desc: 制动阀/执行器响应迟缓或卡滞，EBR 断点诊断检出
  detect: EBR 硬线回路断点诊断（ebr）+ 执行反馈超时
  inject: 注入 EBR 回路断点/执行器无响应
  recovery: 维护复位 + 冗余通道投入
- fid: F-TCMS-021
  key: arbitration_error
  name: 仲裁错误
  subsystem: 网络
  layer: bus
  level: minor
  action: warning
  sil: '1'
  desc: 总线仲裁阶段错误（位错误），发送重试
  detect: 错误状态机仲裁错误计数（errstate）
  inject: 仲裁位错误注入（errstate 注入器）
  recovery: 错误计数衰减后自动恢复
- fid: F-TCMS-022
  key: short_frame
  name: 短帧（DLC 不足）
  subsystem: 网络
  layer: frame
  level: minor
  action: warning
  sil: '1'
  desc: 报文数据长度不足，信号不完整
  detect: DLC 校验（canlog/parser 长度检查）
  inject: 注入 DLC 不足的短帧
  recovery: 完整帧到达后恢复
- fid: F-TCMS-023
  key: hvac_compressor_fault
  name: 空调压缩机故障
  subsystem: 空调
  layer: application
  level: minor
  action: warning
  sil: '1'
  desc: 空调压缩机运行异常（过流/卡缸），制冷能力下降
  detect: HVAC 状态反馈异常 + 电流监测
  inject: 注入空调压缩机故障状态位
  recovery: 压缩机复位后恢复制冷
- fid: F-TCMS-024
  key: hvac_cabin_overheat
  name: 客室温度过高
  subsystem: 空调
  layer: application
  level: major
  action: derate
  sil: '2'
  desc: 客室温度超过舒适上限并持续上升（夏季空调失效场景）
  detect: 温度传感器阈值监测（客室温度>28°C 持续）
  inject: 注入客室温度高值 + 制冷失效
  recovery: 温度回落至正常后解除
- fid: F-TCMS-025
  key: smoke_detected
  name: 烟火报警
  subsystem: 乘客安全
  layer: application
  level: critical
  action: shutdown
  sil: '4'
  desc: 客室/设备舱烟雾探测器触发（烟火安全 SIL4）
  detect: 烟雾探测器触发 + 火灾报警回路
  inject: 注入烟雾探测器触发信号
  recovery: 确认无火情后人工复位
- fid: F-TCMS-026
  key: bogie_vibration_high
  name: 走行部振动异常
  subsystem: 走行部
  layer: signal
  level: minor
  action: warning
  sil: '1'
  desc: 转向架/走行部振动加速度超限（轴承早期损伤征兆）
  detect: 走行部振动监测（加速度阈值 + 趋势）
  inject: 注入振动加速度高值
  recovery: 振动回落至正常后恢复
- fid: F-TCMS-027
  key: door_open_moving
  name: 运行中车门打开
  subsystem: 车门
  layer: application
  level: critical
  action: emergency_brake
  sil: '4'
  desc: 列车移动时车门状态=Open（联锁违规，故障安全优先）
  detect: 门-车联锁（interlocks：移动×门开即 EB 请求）
  inject: 注入运行中 DoorControl 门状态 Open
  recovery: 停车后关门且联锁复位
- fid: F-TCMS-028
  key: rear_door_fault
  name: 后车门故障（按未关处理）
  subsystem: 车门
  layer: signal
  level: major
  action: derate
  sil: '2'
  desc: 后车门（Door5-8）状态不可信，禁止发车
  detect: DoorControlRear 状态枚举检查（状态=2/3）
  inject: 注入 DoorControlRear 门状态 Fault/Unknown
  recovery: 车门状态恢复正常且联锁通过
- fid: F-TCMS-029
  key: door_air_pressure_low
  name: 车门气源压力不足
  subsystem: 车门
  layer: application
  level: major
  action: derate
  sil: '2'
  desc: 气动门气源压力低于操作下限，门操作不可靠
  detect: 气源压力监测 + 门操作响应检查
  inject: 注入气源压力低状态
  recovery: 气源恢复后切除/复位
- fid: F-TCMS-030
  key: traction_converter_fault
  name: 牵引变流器故障
  subsystem: 牵引
  layer: application
  level: major
  action: derate
  sil: '2'
  desc: 牵引变流器故障（故障码非 0），牵引封锁/降功率
  detect: Traction_Converter.ConvFaultCode / TracDisable 状态
  inject: 注入变流器故障码
  recovery: 故障复位后重新使能
- fid: F-TCMS-031
  key: traction_converter_overheat
  name: 牵引变流器过温
  subsystem: 牵引
  layer: signal
  level: major
  action: derate
  sil: '2'
  desc: 变流器温度超限，需降功率冷却（避免过热跳闸）
  detect: Traction_Converter.ConvTemp 阈值监测
  inject: 注入 ConvTemp 高值
  recovery: 温度回落至正常后自动解除
- fid: F-TCMS-032
  key: dc_link_undervoltage
  name: 直流母线欠压
  subsystem: 牵引
  layer: application
  level: major
  action: derate
  sil: '2'
  desc: 直流母线电压低于牵引允许值，封锁牵引
  detect: Traction_Converter.DcLinkVoltage 阈值监测
  inject: 注入 DcLinkVoltage 低值
  recovery: 母线电压恢复后解除
- fid: F-TCMS-033
  key: brake_cylinder_leak
  name: 制动缸压力泄漏
  subsystem: 制动
  layer: signal
  level: major
  action: derate
  sil: '2'
  desc: 制动缸压力指令-反馈偏差大（泄漏），补偿制动降级
  detect: 压力闭环偏差监测（exec_feedback/ebm）
  inject: 注入压力反馈偏低
  recovery: 泄漏消除 + 压力闭环重建
- fid: F-TCMS-034
  key: brake_wsp_fault
  name: 防滑系统故障
  subsystem: 制动
  layer: application
  level: minor
  action: warning
  sil: '1'
  desc: 防滑（WSP）自检失败或运行故障，滑行保护降级
  detect: Brake_Wsp.WspFault / WspActive 自检状态
  inject: 注入 WspFault 置位
  recovery: WSP 自检通过后恢复
- fid: F-TCMS-035
  key: brake_reserve_low
  name: 备用制动压力低
  subsystem: 制动
  layer: signal
  level: major
  action: derate
  sil: '2'
  desc: 备用制动储压不足，常用制动储备下降，需限速
  detect: BrakeSystem.ReservePressureLow 状态位
  inject: 注入 ReservePressureLow 置位
  recovery: 压力恢复后复位
- fid: F-TCMS-036
  key: pantograph_fail_raise
  name: 受电弓无法升起
  subsystem: 受电弓
  layer: application
  level: major
  action: derate
  sil: '2'
  desc: 升弓指令后无确认（控制/气路失效），无法取流运行
  detect: PantographStatus.PantographUp × 升弓指令一致性
  inject: 注入升弓无确认状态
  recovery: 控制/气路修复后重新升弓
- fid: F-TCMS-037
  key: line_voltage_sag
  name: 网压跌落
  subsystem: 受电弓
  layer: signal
  level: minor
  action: warning
  sil: '1'
  desc: 网压周期性低于阈值（受流不良/分段绝缘器），告警
  detect: PantographStatus.LineVoltage 阈值/趋势监测
  inject: 注入 LineVoltage 低值
  recovery: 网压恢复后自动解除
- fid: F-TCMS-038
  key: battery_insulation_fault
  name: 电池绝缘监测报警
  subsystem: 能源
  layer: application
  level: critical
  action: shutdown
  sil: '3'
  desc: 高压回路绝缘阻抗下降（漏电风险），安全分断高压
  detect: 绝缘监测单元报警（漏电流/阻抗阈值）
  inject: 注入绝缘报警状态
  recovery: 绝缘处理 + 人工复位
- fid: F-TCMS-039
  key: battery_voltage_imbalance
  name: 电池单体电压不均衡
  subsystem: 能源
  layer: signal
  level: minor
  action: warning
  sil: '1'
  desc: 单体间压差超限（不均衡），均衡策略介入
  detect: EnergyStatus.BatteryVoltage 波动 + 单体监测
  inject: 注入不均衡电压特征
  recovery: 均衡后恢复
- fid: F-TCMS-040
  key: bms_charge_state_conflict
  name: 充放电状态冲突
  subsystem: 能源
  layer: application
  level: major
  action: derate
  sil: '2'
  desc: 充/放电/故障状态矛盾（接触器粘连迹象），能量管理降级
  detect: EnergyStatus.ChargeState 状态机异常检查
  inject: 注入矛盾状态
  recovery: 状态机复位后恢复
- fid: F-TCMS-041
  key: aux_converter_fault
  name: 辅助变流器故障
  subsystem: 辅助电源
  layer: application
  level: major
  action: derate
  sil: '2'
  desc: 辅助变流器失效（AuxConverterFault），低压负载降级
  detect: Aux_Converter.AuxConverterFault 状态位
  inject: 注入辅助变流器故障位
  recovery: 变流器复位重启后恢复
- fid: F-TCMS-042
  key: aux_voltage_out_of_range
  name: 辅助电压越限
  subsystem: 辅助电源
  layer: signal
  level: major
  action: derate
  sil: '2'
  desc: 辅助母线电压超出允许范围（逆变异常/负载突变）
  detect: Aux_Converter.AuxVoltage 上下限监测
  inject: 注入 AuxVoltage 越限值
  recovery: 电压回范围后自动恢复
- fid: F-TCMS-043
  key: aux_converter_overload
  name: 辅助变流器过载
  subsystem: 辅助电源
  layer: application
  level: minor
  action: warning
  sil: '1'
  desc: 辅助负载长时间高载，预警（防过热跳闸）
  detect: Aux_Converter.AuxLoadPercent 阈值监测
  inject: 注入高负载值
  recovery: 负载回落后解除
- fid: F-TCMS-044
  key: aux_contactor_weld
  name: 辅助接触器粘连
  subsystem: 辅助电源
  layer: application
  level: major
  action: shutdown
  sil: '3'
