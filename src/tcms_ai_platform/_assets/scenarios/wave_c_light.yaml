# 场景扩容 Wave C（无孤儿覆盖）：light_emergency_battery_low, light_marker_fail, light_headlight_dimmer_fail
name: Wave C 域内多故障编排：light_emergency_battery_low/light_marker_fail/light_headlight_dimmer_fail
steps:
- at: 3.0
  inject:
    node: light
    fault: light_emergency_battery_low
    level: minor
    impact: 应急照明后备电池容量低（疏散保障）
    expect: warning
- at: 4.5
  inject:
    node: light
    fault: light_marker_fail
    level: minor
    impact: 车侧标志/运营标识灯失效
    expect: warning
- at: 6.0
  inject:
    node: light
    fault: light_headlight_dimmer_fail
    level: minor
    impact: 前照灯调光/远近光切换异常
    expect: warning
- at: 10.0
  recover: light_emergency_battery_low
- at: 11.5
  recover: light_marker_fail
- at: 13.0
  recover: light_headlight_dimmer_fail
