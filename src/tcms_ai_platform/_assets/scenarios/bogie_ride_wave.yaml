# 场景扩容 Wave A（无孤儿覆盖）：bogie_damper_fault, bogie_gearbox_overheat
name: Wave A 域内多故障编排：bogie_damper_fault/bogie_gearbox_overheat
steps:
- at: 3.0
  inject:
    node: bogie
    fault: bogie_damper_fault
    level: major
    impact: 横向抗蛇行减振失效（稳定性风险），限速运行
    expect: derate
- at: 4.5
  inject:
    node: bogie
    fault: bogie_gearbox_overheat
    level: major
    impact: 齿轮箱油温超限（润滑恶化风险），限速运行
    expect: derate
- at: 10.0
  recover: bogie_damper_fault
- at: 11.5
  recover: bogie_gearbox_overheat
