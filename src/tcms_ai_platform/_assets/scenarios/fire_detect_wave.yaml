# 场景扩容 Wave A（无孤儿覆盖）：fire_detector_contamination, fire_extinguisher_pressure_low
name: Wave A 域内多故障编排：fire_detector_contamination/fire_extinguisher_pressure_low
steps:
- at: 3.0
  inject:
    node: fire
    fault: fire_detector_contamination
    level: minor
    impact: 探测器积尘/污染致灵敏度异常（误报风险），自诊断告警
    expect: warning
- at: 4.5
  inject:
    node: fire
    fault: fire_extinguisher_pressure_low
    level: major
    impact: 灭火装置压力低于保障下限，灭火能力下降
    expect: warning
- at: 10.0
  recover: fire_detector_contamination
- at: 11.5
  recover: fire_extinguisher_pressure_low
